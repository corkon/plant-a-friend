<style>
/* Layout: eine Bildschirm-App. Kopfleiste oben, scrollender Garten, Tab-Leiste unten, Sheets von unten. */
:root {
  --bg: #fbf1dc; --bg2: #f4e2bf; --head: #c8694a; --title: #b5593a;

@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #2a1a13; --bg2: #36241b; --head: #8d482f; --title: #f0b08c;
    --card: #573727; --floor: #69442f; --btn: #7a4e38;
    --line: #d4845c; --ink: #fbe9d2; --ink2: #d9b9a0;
    --green: #86b25a; --on-green: #241509;
    --f-ok: #47702f; --f-warn: #8c6012; --f-wilt: #74492f;
    --warn: #ff8e7e; --on-warn: #2a0d08; --amber: #f0b43c;
    --note: #f0dc8a; --note-ink: #40330a; --shade: rgba(0, 0, 0, .35);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #2a1a13; --bg2: #36241b; --head: #8d482f; --title: #f0b08c;
  --card: #573727; --floor: #69442f; --btn: #7a4e38;
  --line: #d4845c; --ink: #fbe9d2; --ink2: #d9b9a0;
  --green: #86b25a; --on-green: #241509;
  --f-ok: #47702f; --f-warn: #8c6012; --f-wilt: #74492f;
  --warn: #ff8e7e; --on-warn: #2a0d08; --amber: #f0b43c;
  --note: #f0dc8a; --note-ink: #40330a; --shade: rgba(0, 0, 0, .35);
  color-scheme: dark;

*, *::before, *::after { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--ink);

body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); background: var(--head); z-index: 10; }

button, input, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 3px solid var(--ink); outline-offset: 3px; }
svg { display: block; flex: none; shape-rendering: crispEdges; }
h1, h2, h3, p, ul, dl, dd { margin: 0; }
ul { padding: 0; list-style: none; }

/* Pixel-Rahmen: vier Schatten statt border, so entstehen abgestufte Ecken. */
.px { box-shadow: 0 -3px 0 0 var(--line), 0 3px 0 0 var(--line), -3px 0 0 0 var(--line), 3px 0 0 0 var(--line); }
.px-s { box-shadow: 0 -2px 0 0 var(--line), 0 2px 0 0 var(--line), -2px 0 0 0 var(--line), 2px 0 0 0 var(--line); }

#app { display: flex; flex-direction: column; height: 100%; }

/* Kopfleiste */
.top { flex: none; background: var(--head); padding: 12px max(16px, env(safe-area-inset-right, 0px)) 12px max(16px, env(safe-area-inset-left, 0px)); }
.bar { display: flex; align-items: center; gap: 6px; max-width: 720px; margin: 0 auto; padding: 6px 8px; background: var(--bg); }
.bar h1 { flex: 1; min-width: 0; text-align: center; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-size: clamp(19px, 5.8vw, 26px); font-weight: 800; letter-spacing: .01em; color: var(--title); }
.icon-btn { width: 44px; height: 44px; display: grid; place-items: center; padding: 0; border: 0; background: transparent; color: var(--title); }
.icon-btn:active { transform: translateY(2px); }

/* Inhalt */
main { flex: 1; min-height: 0; overflow-y: auto; overscroll-behavior: contain; }
.wrap { max-width: 720px; margin: 0 auto; padding: 18px max(16px, env(safe-area-inset-right, 0px)) 28px max(16px, env(safe-area-inset-left, 0px)); display: flex; flex-direction: column; gap: 22px; }
.group { display: flex; flex-direction: column; gap: 14px; }
.group-title { display: flex; align-items: center; gap: 8px; font-size: 18px; font-weight: 700; letter-spacing: .01em; color: var(--title); }
.group-title .count { margin-left: auto; padding: 0 8px; background: var(--card); color: var(--ink); font-size: 13px; }
.group.urgent .group-title { color: var(--warn); }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 18px 14px; }

/* Karte */
.card { min-width: 0; display: flex; flex-direction: column; gap: 6px; padding: 10px 10px 8px; background: var(--card); cursor: pointer; }
.sprite-box { position: relative; display: grid; place-items: end center; background: linear-gradient(to top, var(--floor) 0 24%, transparent 24%); }
.sprite { width: 100%; max-width: 144px; aspect-ratio: 1; image-rendering: pixelated; }
.streak { position: absolute; top: 0; right: 0; display: inline-flex; align-items: center; gap: 3px; padding: 1px 6px; background: var(--btn); font-size: 13px; font-weight: 700; color: var(--ink); }
.streak svg { color: var(--amber); }
.species { text-align: center; font-size: 13px; color: var(--ink); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.name-row { display: flex; flex-direction: column; align-items: center; gap: 6px; min-width: 0; text-align: center; }
.fname { max-width: 100%; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 19px; font-weight: 700; letter-spacing: .01em; }

.pill { position: relative; flex: none; display: inline-flex; align-items: center; justify-content: center; gap: 3px; min-width: 104px; padding: 2px 8px; overflow: hidden; background: var(--btn); font-size: 12px; font-weight: 700; white-space: nowrap; }
.pill i { position: absolute; inset: 0 auto 0 0; background: var(--f-ok); }
.pill > svg, .pill > b { position: relative; }
.pill-dringlich i { background: var(--f-warn); }
.pill-verwelkt i { background: var(--f-wilt); }
.pill-gerissen i { width: 0 !important; }

/* Buttons */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 44px; padding: 6px 16px; margin-bottom: 5px;
  border: 0; background: var(--btn); color: var(--ink); font-weight: 700; letter-spacing: .01em; text-decoration: none; text-align: center;
  box-shadow: 0 -2px 0 0 var(--line), 0 2px 0 0 var(--line), -2px 0 0 0 var(--line), 2px 0 0 0 var(--line), 0 5px 0 0 var(--line);
}
.btn:active { transform: translateY(3px); box-shadow: 0 -2px 0 0 var(--line), 0 2px 0 0 var(--line), -2px 0 0 0 var(--line), 2px 0 0 0 var(--line), 0 2px 0 0 var(--line); }
.btn.sm { min-height: 38px; padding: 4px 10px; font-size: 14px; }
.btn.full { width: 100%; }
.btn.primary { background: var(--green); color: var(--on-green); }
.btn.danger { background: var(--warn); color: var(--on-warn); }
.btn[disabled], .btn[aria-disabled="true"] { opacity: .5; pointer-events: none; }
.card .btn { width: 100%; }

/* Tab-Leiste */
.tabs { flex: none; display: grid; grid-template-columns: repeat(3, 1fr); gap: 0; background: var(--bg2); border-top: 3px solid var(--line); padding: 0 max(16px, env(safe-area-inset-right, 0px)) 0 max(16px, env(safe-area-inset-left, 0px)); }
.tab { display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 8px 4px 9px; border: 0; background: transparent; color: var(--ink); font-size: 13px; font-weight: 700; letter-spacing: .01em; }
.tab .ic { height: 27px; display: flex; align-items: flex-end; }
.tab[aria-current="page"] { background: var(--green); color: var(--on-green); }

/* Hinweise */
.banner { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; padding: 10px 12px; background: var(--bg2); border: 3px dashed var(--line); }
.banner p { flex: 1; min-width: 160px; font-size: 14px; }
.empty { display: flex; flex-direction: column; align-items: center; gap: 12px; padding: 24px 8px; text-align: center; }
.empty .sprite { max-width: 120px; }
.muted { color: var(--ink2); font-size: 14px; }
.err { min-height: 0; color: var(--warn); font-size: 14px; }
.err:empty { display: none; }

/* Sheets */
.overlay {
  position: fixed; inset: 0; z-index: 20; display: flex; align-items: flex-end; justify-content: center; background: rgba(40, 18, 8, .55);
  padding: max(12px, env(safe-area-inset-top, 0px)) max(12px, env(safe-area-inset-right, 0px)) max(14px, env(safe-area-inset-bottom, 0px)) max(12px, env(safe-area-inset-left, 0px));
}
.sheet { width: 100%; max-width: 520px; max-height: 100%; display: flex; flex-direction: column; background: var(--bg); animation: rise .2s steps(4) both; }
@keyframes rise { from { transform: translateY(28px); opacity: .3; } to { transform: none; opacity: 1; } }
@media (prefers-reduced-motion: reduce) { .sheet { animation: none; } }
.sheet-head { flex: none; display: flex; align-items: center; gap: 8px; padding: 6px 6px 6px 16px; border-bottom: 3px solid var(--line); }
.sheet-head h2 { flex: 1; min-width: 0; font-size: 19px; font-weight: 700; letter-spacing: .01em; color: var(--title); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.sheet-head .icon-btn { color: var(--ink); }
.sheet-body { min-height: 0; overflow-y: auto; display: flex; flex-direction: column; gap: 16px; padding: 16px 16px 14px; }

/* Formulare */
.field { display: flex; flex-direction: column; gap: 8px; min-width: 0; }
.lbl { font-size: 14px; font-weight: 700; letter-spacing: .01em; color: var(--ink2); }
input[type="text"], input[type="number"], input[type="date"], textarea {
  width: 100%; min-height: 44px; padding: 8px 10px; border: 0; border-radius: 0; background: var(--btn); color: var(--ink);
  box-shadow: 0 -2px 0 0 var(--line), 0 2px 0 0 var(--line), -2px 0 0 0 var(--line), 2px 0 0 0 var(--line);
}
textarea { resize: vertical; min-height: 96px; }
textarea.sticky { resize: none; min-height: 88px; background: var(--note); color: var(--note-ink); box-shadow: 4px 4px 0 0 var(--shade); }
.check { display: flex; align-items: center; gap: 10px; min-height: 44px; }
.check input { width: 22px; height: 22px; accent-color: var(--green); flex: none; }
.seg { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; gap: 10px; }
.seg-btn { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; min-height: 48px; padding: 6px 4px; border: 0; background: var(--btn); color: var(--ink); font-weight: 700; text-align: center; box-shadow: 0 -2px 0 0 var(--line), 0 2px 0 0 var(--line), -2px 0 0 0 var(--line), 2px 0 0 0 var(--line); }
.seg-btn small { font-size: 12px; font-weight: 500; }
.seg-btn.on { background: var(--green); color: var(--on-green); }
.picker-wrap { display: flex; flex-direction: column; gap: 14px; max-height: 340px; overflow-y: auto; padding: 4px 4px 4px 0; overscroll-behavior: contain; }
.pgroup h4 { margin: 0 0 8px; font-size: 13px; font-weight: 800; letter-spacing: .02em; color: var(--ink2); }
.picker { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.rare { display: block; margin-top: -1px; padding: 0 6px; background: var(--note); color: var(--note-ink); font-size: 10px; font-weight: 800; letter-spacing: .03em; }
.pick.lock { opacity: .55; }
.pick.lock .sprite { filter: grayscale(1); }
.pots .rare { background: var(--btn); color: var(--ink2); }
.pick { display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 4px 2px 6px; border: 0; background: var(--card); color: var(--ink); font-size: 12px; font-weight: 700; text-align: center; box-shadow: 0 -2px 0 0 transparent, 0 2px 0 0 transparent, -2px 0 0 0 transparent, 2px 0 0 0 transparent; }
.pick .sprite { max-width: 72px; }
.pick[aria-pressed="true"] { box-shadow: 0 -3px 0 0 var(--ink), 0 3px 0 0 var(--ink), -3px 0 0 0 var(--ink), 3px 0 0 0 var(--ink); background: var(--floor); }
.row { display: flex; gap: 12px; flex-wrap: wrap; align-items: center; }
.row > * { flex: 1 1 140px; }

/* Detail */
.d-top { display: flex; gap: 14px; align-items: center; }
.d-top .sprite-box { flex: none; width: 128px; background: var(--card); }
.d-info { min-width: 0; display: flex; flex-direction: column; gap: 6px; align-items: flex-start; }
.d-info h3 { font-size: 18px; font-weight: 700; letter-spacing: .01em; overflow-wrap: anywhere; }
.stats { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.stat { padding: 8px 10px; background: var(--card); }
.stat dt { font-size: 12px; letter-spacing: .01em; color: var(--ink2); }
.stat dd { font-size: 17px; font-weight: 700; }
.hist li { display: flex; justify-content: space-between; gap: 8px; padding: 6px 0; border-bottom: 2px dotted var(--line); font-size: 15px; }
.hist li:last-child { border-bottom: 0; }
.counter { align-self: flex-end; font-size: 12px; color: var(--ink2); }
.actions { display: grid; grid-template-columns: 1fr 1fr; gap: 14px 12px; }
.actions .full { grid-column: 1 / -1; }

/* Abzeichen */
.lvl { display: flex; flex-direction: column; gap: 10px; padding: 14px; background: var(--card); }
.lvl h3 { font-size: 24px; font-weight: 700; }
.meter { height: 16px; background: var(--btn); }
.meter i { display: block; height: 100%; background: var(--green); }
.hearts { display: flex; gap: 6px; align-items: center; }
.heart { color: var(--ink2); opacity: .35; }
.heart.on { color: #d6483a; opacity: 1; }
.badges { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 16px 14px; }
.badge { display: flex; flex-direction: column; align-items: flex-start; gap: 4px; padding: 10px; background: var(--card); }
.badge h3 { font-size: 13px; font-weight: 700; }
.badge p { font-size: 13px; color: var(--ink2); }
.bicon { width: 80px; height: 80px; image-rendering: pixelated; }
.badge.locked { opacity: .7; }
.badge.locked .bicon { filter: grayscale(1); opacity: .45; }

/* Archiv */
.arch { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; padding: 10px; background: var(--card); }
.arch .sprite { width: 64px; flex: none; }
.arch .who { flex: 1 1 120px; min-width: 0; }
.arch .who b { display: block; font-size: 17px; overflow-wrap: anywhere; }
.arch .btns { display: flex; gap: 10px; flex-wrap: wrap; }

.json { min-height: 120px; font-size: 12px; font-family: ui-monospace, Menlo, Consolas, monospace; }
.sec { display: flex; flex-direction: column; gap: 10px; padding-top: 14px; border-top: 3px dotted var(--line); }
.sec:first-child { padding-top: 0; border-top: 0; }
.plain-list { display: flex; flex-direction: column; gap: 8px; }
.plain-list li { display: flex; justify-content: space-between; gap: 10px; }

#toast { position: fixed; left: 50%; bottom: calc(92px + env(safe-area-inset-bottom, 0px)); z-index: 30; max-width: min(92vw, 420px); padding: 8px 14px; transform: translateX(-50%); background: var(--ink); color: var(--bg); font-weight: 700; text-align: center; pointer-events: none; opacity: 0; }
#toast.show { opacity: 1; }


/* Pixel-Schrift nur für Überschriften, Namen und Kategorien: etwas größer, kräftiger und mit mehr Abstand, damit sie gut lesbar bleibt. */
.bar h1, .group-title, .fname, .sheet-head h2, .d-info h3, .lvl h3, .badge h3, .stat dd, .streak, .empty h2, .pgroup h4 {
  font-family: var(--font); font-weight: 700; letter-spacing: .02em; font-synthesis: none; text-transform: uppercase;
}
.streak { font-family: var(--font-body); font-weight: 800; letter-spacing: 0; text-transform: none; }
.bar h1 { font-size: clamp(17px, 5vw, 22px); letter-spacing: .03em; }
.group-title { font-size: 15px; }
.fname { font-size: 15px; line-height: 1.2; }
.sheet-head h2 { font-size: 17px; }
.d-info h3 { font-size: 18px; line-height: 1.15; }
.lvl h3 { font-size: 20px; }
.badge h3 { font-size: 13px; line-height: 1.2; }
.stat dd { font-size: 16px; }
.streak { font-size: 13px; }
.pgroup h4 { font-size: 12px; }

/* Knöpfe in Pixelschrift */
.btn { font-family: var(--font); font-weight: 700; text-transform: uppercase; letter-spacing: .03em; font-size: 13px; font-synthesis: none; }
.btn.sm { font-size: 12px; }

</style>

  <header class="top">
    <div class="bar px">

</div>

<script>
/* Pixel-Pflanzen: zeichnet 48x48-Sprites per Code (keine Bilddateien noetig). */
(function (root) {
  'use strict';

    constructor() { this.c = new Array(W * H).fill(null); this.k = new Array(W * H).fill(0); this.potO = '#6e3219'; this.dy = 0; }
    set(x, y, col, k) {
      x = Math.round(x); y = Math.round(y) - this.dy;
      if (!col || x < 0 || y < 0 || x >= W || y >= H) return;
      this.c[y * W + x] = col; this.k[y * W + x] = k || 1;

  const rect = (g, x, y, w, h, col, k) => { for (let j = 0; j < h; j++) for (let i = 0; i < w; i++) g.set(x + i, y + j, col, k); };

    x0 = Math.round(x0); y0 = Math.round(y0); x1 = Math.round(x1); y1 = Math.round(y1);

  function outline(g, P) {

  /* ---------- Pflanzen ---------- */

  function sprout(g, w, P) {

  function pilea(g, st, w, P) {

  /* ---------- Erweiterung: frei einstellbare Blattpflanzen und Ranker ---------- */
  Object.assign(POTS, {
    sage: { m: '#a9c2a0', d: '#86a27e', l: '#c9ddc0', o: '#47643f' },

    else { sp.draw(g, stage, wilt, P); drawPot(g, sp.pot, sp.deco, sp.shape); }

    const out = new Uint8ClampedArray(W * H * 4), b = bg ? hex2rgb(bg) : null;

  }

<script>
/* Oberflaeche der Freundschafts-Pflanzen-App. Baut alles mit h() auf, Namen und Notizen landen nie als HTML. */
(function () {
  'use strict';
  const L = window.Logic, SP = window.Sprites;
  const ui = { tab: 'garten' };

  /* ---------- kleine Helfer ---------- */
  function add(el, kids) {
    for (const k of kids) {
      if (k === null || k === undefined || k === false) continue;
      if (Array.isArray(k)) add(el, k); else el.append(k.nodeType ? k : document.createTextNode(String(k)));

      if (k === 'class') el.className = v;
      else if (k === 'on') for (const ev in v) el.addEventListener(ev, v[ev]);
      else if (k === 'value' || k === 'checked' || k === 'disabled' || k === 'hidden') el[k] = v;
      else el.setAttribute(k, v === true ? '' : v);
    }
    add(el, kids);
    return el;
  }

  const ICONS = {
    heart: ['.##...##.', '####.####', '#########', '#########', '.#######.', '..#####..', '...###...', '....#....'],
    menu: ['#########', '.........', '#########', '.........', '#########'],
    plus: ['...##...', '...##...', '...##...', '########', '########', '...##...', '...##...', '...##...'],
    drop: ['....#....', '....#....', '...###...', '...###...', '..#####..', '.#######.', '.#######.', '.#######.', '..#####..'],
    chat: ['.#######.', '#########', '#########', '#########', '.#######.', '..##.....', '.##......'],
    home: ['....#....', '...###...', '..#####..', '.#######.', '#########', '.###.###.', '.###.###.', '.###.###.'],
    box: ['#########', '#########', '.#######.', '.#######.', '.#.###.#.', '.#######.', '.#######.'],
    star: ['....#....', '....#....', '...###...', '#########', '.#######.', '..#####..', '..##.##..', '.##...##.', '.#.....#.'],
    close: ['##...##', '###.###', '.#####.', '..###..', '.#####.', '###.###', '##...##'],
    check: ['.......##', '......###', '##...###.', '###.###..', '.#####...', '..###....', '...#.....']
  };
  function icon(name, size) {

    const svg = document.createElementNS(NS, 'svg'), p = document.createElementNS(NS, 'path');
    let d = '';
    rows.forEach((r, y) => { const m = r.match(/#+/g); if (!m) return; let x = 0; r.replace(/(\.*)(#+)/g, (all, dots, hashes) => { x += dots.length; d += 'M' + x + ' ' + y + 'h' + hashes.length + 'v1h-' + hashes.length + 'z'; x += hashes.length; return all; }); });
    p.setAttribute('d', d); p.setAttribute('fill', 'currentColor');

  const plural = (n, a, b) => n + ' ' + (n === 1 ? a : b);

  function toast(msg) {

  function spriteImg(f, I, size) {

  /* ---------- Sheets ---------- */
  function closeSheet() {

  function openSheet(title, content) {

    sheetEl = h('div', { class: 'overlay', on: { click: e => { if (e.target === sheetEl) closeSheet(); } } }, panel);
    document.body.append(sheetEl);

  }

  function confirmBtn(label, confirmLabel, onConfirm, cls) {

    const b = h('button', { type: 'button', class: 'btn sm ' + (cls || ''), on: { click: () => {
      if (!armed) { armed = true; b.textContent = confirmLabel; b.classList.add('danger'); timer = setTimeout(reset, 4500); }
      else { clearTimeout(timer); onConfirm(); }
    } } }, label);
    function reset() { armed = false; b.textContent = label; b.classList.remove('danger'); }
    return b;
  }

  function segmented(options, value, onChange, label) {
    const wrap = h('div', { class: 'seg', role: 'radiogroup', 'aria-label': label });
    const draw = () => wrap.replaceChildren(...options.map(o => h('button', {
      type: 'button', class: 'seg-btn' + (o.id === value ? ' on' : ''), role: 'radio', 'aria-checked': String(o.id === value),
      on: { click: () => { value = o.id; onChange(value); draw(); } }

    return wrap;
  }

  /* ---------- Gießen ---------- */
  function openWater(id) {
    const f = byId(id); if (!f) return;
    const I0 = L.info(f);
    const d = { type: 'nachricht', date: L.todayTs(), joker: true };
    const alertBox = h('div', { class: 'field', 'aria-live': 'polite' });
    const dateIn = h('input', { id: 'w-date', type: 'date', value: L.iso(d.date), max: L.iso(L.todayTs()), min: L.iso(L.addDays(L.todayTs(), -365)) });

    function refresh() {
      const v = dateIn.value ? L.fromIso(dateIn.value) : L.todayTs();
      d.date = Math.min(v, L.todayTs());
      const g = L.grace(f), late = L.dayDiff(d.date, L.addDays(f.lastWatered, L.interval(f)));
      const kids = [];
      if (d.date <= f.lastWatered) kids.push(h('p', { class: 'muted' }, 'Das Datum liegt vor dem letzten Eintrag. Es wird nur in den Verlauf geschrieben, der Streak bleibt.'));
      else if (late > 0 && late <= g) {
        if (L.jokersLeft() > 0) {
          const cb = h('input', { id: 'w-joker', type: 'checkbox', checked: d.joker, on: { change: e => { d.joker = e.target.checked; } } });
          kids.push(h('p', null, 'Die Pflanze ist verwelkt. Mit einer Wiederbelebung bleibt dein Streak von ' + f.streak + ' erhalten.'),
            h('label', { class: 'check', for: 'w-joker' }, cb, 'Wiederbelebung einsetzen (noch ' + L.jokersLeft() + ' von ' + L.JOKERS + ' in diesem Monat)'));
        } else kids.push(h('p', null, 'Die Pflanze ist verwelkt und diesen Monat ist keine Wiederbelebung mehr frei. Der Streak startet neu.'));
      } else if (late > g) kids.push(h('p', null, 'Der Streak ist gerissen. Mit diesem Eintrag wächst die Pflanze neu.'));

    }

    const save = h('button', { type: 'button', class: 'btn primary full', on: { click: () => {
      refresh();
      const hadStreak = f.streak;
      const r = L.water(f, d.type, d.date, d.joker);

      else if (r.restarted) toast('Neuer Anfang für ' + f.name + '.');

      else toast('Eingetragen.');
      L.checkBadges().map(b => 'Neues Abzeichen: ' + b.name).concat(r.unlocked.map(k => 'Neuer Topf für ' + f.name + ': ' + k.label))
        .forEach((m, n) => setTimeout(() => toast(m), 1700 * (n + 1)));

    } } }, icon('heart', 2), 'Eintragen');

    openSheet('Gießen: ' + f.name, [
      I0.st === 'gerissen' && h('p', { class: 'muted' }, 'Der Streak ist gerissen. Mit dem nächsten Eintrag wächst die Pflanze von vorn.'),
      h('div', { class: 'field' }, h('span', { class: 'lbl' }, 'Wie hast du dich gemeldet?'),
        segmented(L.TYPES, d.type, v => { d.type = v; }, 'Art des Kontakts')),
      h('div', { class: 'field' }, h('label', { class: 'lbl', for: 'w-date' }, 'Wann?'), dateIn),
      alertBox, save

    refresh();
  }

  function potHint(f) {
    const have = L.SKINS.filter(k => L.skinOk(f, k.id)).length, next = L.SKINS.find(k => k.need > f.best);
    return h('p', { class: 'muted' }, 'Töpfe: ' + have + ' von ' + L.SKINS.length + ' freigeschaltet. ' + (next ? 'Der nächste („' + next.label + '“) kommt bei Streak ' + next.need + '.' : 'Du hast alle Töpfe.'));
  }

  /* ---------- Detail ---------- */
  function openDetail(id) {
    const f = byId(id); if (!f) return;
    const I = L.info(f);
    const counter = h('span', { class: 'counter' }, f.note.length + '/120');
    const note = h('textarea', { id: 'd-note', class: 'sticky', maxlength: '120', rows: '3', placeholder: 'Kurze Notiz, zum Beispiel ein Thema fürs nächste Melden', on: { input: e => { f.note = e.target.value.slice(0, 120); counter.textContent = f.note.length + '/120'; L.save(); } } });
    note.value = f.note;

    const hist = f.history.slice(0, 6);
    const lk = f.link ? L.cleanLink(f.link) : { ok: false };
    const safeLink = lk.ok ? lk.value : '';
    const actions = h('div', { class: 'actions' },
      h('button', { type: 'button', class: 'btn primary', on: { click: () => openWater(f.id) } }, icon('heart', 2), I.st === 'gerissen' ? 'Neu starten' : 'Gießen'),
      safeLink
        ? h('a', { class: 'btn', href: safeLink, target: '_blank', rel: 'noopener noreferrer' }, icon('chat', 2), 'Melden')

      h('button', { type: 'button', class: 'btn sm', on: { click: () => { L.archive(f); closeSheet(); toast(f.name + ' ist archiviert. Der Streak pausiert.'); render(); } } }, icon('box', 2), 'Archivieren'),
      h('div', { class: 'full' }, confirmBtn('Endgültig löschen', 'Ja, jetzt löschen', () => { L.remove(f); closeSheet(); toast(f.name + ' wurde gelöscht.'); render(); }, 'full')));

      h('div', { class: 'd-top' },

        h('div', { class: 'stat' }, h('dt', null, 'Nächstes Gießen'), h('dd', null, dueText(I))),

      potHint(f),
      h('div', { class: 'field' }, h('label', { class: 'lbl', for: 'd-note' }, 'Notiz'), note, counter),
      actions,
      !safeLink && h('p', { class: 'muted' }, 'Mit einem WhatsApp-Link (zum Beispiel https://wa.me/49170…) öffnet „Melden“ direkt den Chat. Die App speichert sonst keine Kontaktdaten.'),
      h('div', { class: 'field' }, h('span', { class: 'lbl' }, 'Verlauf'),
        hist.length ? h('ul', { class: 'hist' }, hist.map(e => h('li', null, h('span', null, L.TYPE_LABEL[e.type]), h('span', { class: 'muted' }, fmtDate(e.ts))))) : h('p', { class: 'muted' }, 'Noch kein Eintrag.'))
    ]);
  }

  /* ---------- Hinzufügen und Bearbeiten ---------- */
  function nextPlant() {
    const used = L.active().map(f => f.plant);
    return L.PLANTS.find(p => !used.includes(p)) || L.PLANTS[L.active().length % L.PLANTS.length];
  }
  function openEdit(id) {
    const f = id ? byId(id) : null;
    const d = { grade: f ? f.grade : 'normal', plant: f ? f.plant : nextPlant(), pot: f ? (f.pot || '') : '', customOn: !!(f && f.custom) };
    const err = h('p', { class: 'err', role: 'alert' });
    const nameIn = h('input', { id: 'e-name', type: 'text', maxlength: '24', autocomplete: 'off', placeholder: 'Vorname oder Spitzname', value: f ? f.name : '' });
    const linkIn = h('input', { id: 'e-link', type: 'text', autocomplete: 'off', inputmode: 'url', placeholder: '+49 170 1234567 oder https://wa.me/…', value: f ? f.link : '' });
    const numIn = h('input', { id: 'e-days', type: 'number', min: '1', max: '365', inputmode: 'numeric', value: f && f.custom ? String(f.custom) : '' });

    function drawHint() { hint.textContent = 'Standard bei dieser Kategorie: alle ' + plural(L.GRADES[d.grade].days, 'Tag', 'Tage') + '.'; }
    function drawCustom() {

    }
    const gradeSeg = segmented([{ id: 'eng', label: 'Eng', sub: '7 Tage' }, { id: 'normal', label: 'Normal', sub: '21 Tage' }, { id: 'bekannt', label: 'Bekannt', sub: '60 Tage' }], d.grade, v => { d.grade = v; drawHint(); }, 'Freundschaftsgrad');

    const picker = h('div', { class: 'picker-wrap' });
    function drawPicker() {
      picker.replaceChildren(...SP.GROUPS.map(gr => {
        const list = L.PLANTS.filter(p => (SP.SPECIES[p] || {}).group === gr);
        if (!list.length) return null;

          h('img', { class: 'sprite', src: SP.spriteURL(d.plant, 2, 0, k.id), alt: '', width: 72, height: 72 }),
          k.label, h('span', { class: 'rare' }, ok ? (k.need ? 'frei' : '') : 'ab Streak ' + k.need));

      }

      else {
        L.getState().friends.push(L.newFriend({ name, grade: d.grade, custom, plant: d.plant, link: lk.value })); L.save();
        toast(name + ' ist eingepflanzt.');

      }

    } } }, f ? 'Speichern' : 'Einpflanzen');

    }
    function showImport() {
      const ta = h('textarea', { class: 'json', 'aria-label': 'Daten einfügen', placeholder: 'Gesicherten Text hier einfügen' });
      const go = confirmBtn('Laden', 'Ja, aktuelle Daten ersetzen', () => {
        let o = null; try { o = JSON.parse(ta.value); } catch (e) { /* unten melden */ }
        const clean = L.cleanState(o);
        if (!clean) { msg.textContent = 'Das sieht nicht nach gesicherten Daten aus.'; return; }
        L.setState(clean); L.normalize(); L.checkBadges(); L.save(); closeSheet(); toast('Daten geladen.'); render();
      });
      dataBox.replaceChildren(ta, go, msg);
    }

    const urgent = L.active().filter(f => ['dringlich', 'verwelkt'].includes(L.info(f).st)).length;
    const nameBox = h('div', { class: 'sec' }, h('span', { class: 'lbl' }, 'Kategorien umbenennen'),
      h('p', { class: 'muted' }, 'So heißen die Gruppen im Garten. Leer lassen für den Standardnamen.'),
      L.GRADE_ORDER.map(id => h('div', { class: 'field' }, h('label', { class: 'lbl', for: 'gn-' + id }, L.GRADES[id].plural),
        h('input', { id: 'gn-' + id, type: 'text', maxlength: 28, value: L.gradeName(id), placeholder: L.GRADES[id].plural,
          on: { change: e => { L.setGradeName(id, e.target.value); L.save(); e.target.value = L.gradeName(id); render(); } } }))));
    openSheet('Einstellungen', [
      nameBox,
      h('div', { class: 'sec' }, h('span', { class: 'lbl' }, 'Wiederbelebungen'),
        h('p', null, 'Diesen Monat noch ' + L.jokersLeft() + ' von ' + L.JOKERS + ' frei. Der Vorrat gilt für alle Freundschaften zusammen.')),
      h('div', { class: 'sec' }, h('span', { class: 'lbl' }, 'Benachrichtigungen'),
        h('label', { class: 'check', for: 's-weekly' }, weekly, 'Wochenübersicht anzeigen'),
        h('p', { class: 'muted' }, 'Die Übersicht erscheint einmal pro Woche, wenn du die App öffnest. Eine Warnung kurz vor dem Verwelken, die dich auch bei geschlossener App erreicht, braucht eine native App oder einen Push-Dienst. Hier siehst du dringende Pflanzen oben im Garten.'),
        h('button', { type: 'button', class: 'btn sm', on: { click: () => openWeekly(true) } }, 'Übersicht jetzt ansehen' + (urgent ? ' (' + urgent + ')' : ''))),
      h('div', { class: 'sec' }, h('span', { class: 'lbl' }, 'Daten'),
        h('p', { class: 'muted' }, 'Alles liegt nur auf diesem Gerät, in diesem Browser. Sichere die Daten regelmäßig, sonst gehen sie mit dem Browser-Speicher verloren.'),
        h('div', { class: 'row' }, h('button', { type: 'button', class: 'btn sm', on: { click: showExport } }, 'Daten sichern'), h('button', { type: 'button', class: 'btn sm', on: { click: showImport } }, 'Daten laden')),
        dataBox),
      st.demo && h('div', { class: 'sec' }, h('span', { class: 'lbl' }, 'Beispieldaten'), h('p', { class: 'muted' }, 'Du siehst gerade sechs Beispiel-Pflanzen.'),
        confirmBtn('Beispiele entfernen', 'Ja, Garten leeren', () => { L.removeDemo(); closeSheet(); toast('Dein Garten ist leer. Pflanze die erste Freundschaft.'); render(); }))
    ]);
  }

  function openWeekly(manual) {
    const list = L.active().map(f => ({ f, I: L.info(f) })).filter(x => ['dringlich', 'verwelkt', 'gerissen'].includes(x.I.st)).sort((a, b) => b.I.progress - a.I.progress);
    openSheet('Diese Woche', [
      list.length ? h('p', null, plural(list.length, 'Pflanze braucht', 'Pflanzen brauchen') + ' Aufmerksamkeit:') : h('p', null, manual ? 'Alle Pflanzen sind versorgt. Nichts zu tun.' : 'Alle Pflanzen sind versorgt.'),
      list.length && h('ul', { class: 'plain-list' }, list.map(x => h('li', null, h('b', null, x.f.name), h('span', { class: 'muted' }, dueText(x.I))))),
      list.length && h('button', { type: 'button', class: 'btn primary full', on: { click: () => { closeSheet(); ui.tab = 'garten'; render(); } } }, 'Zum Garten')
    ]);
  }
  function weeklyCheck() {
    const st = S();
    if (st.settings.weekly === false || Date.now() - (st.settings.lastWeekly || 0) < 7 * L.DAY) return;
    st.settings.lastWeekly = Date.now(); L.save();
    if (L.active().some(f => ['dringlich', 'verwelkt', 'gerissen'].includes(L.info(f).st))) openWeekly(false);
  }

  /* ---------- Ansichten ---------- */
  const byUrgency = (a, b) => L.info(b).progress - L.info(a).progress || a.name.localeCompare(b.name, 'de');

  function card(f) {
    const I = L.info(f);
    const open = () => openDetail(f.id);
    return h('div', { class: 'card px', role: 'button', tabindex: '0', 'aria-label': f.name + ', ' + L.STATE_LABEL[I.st] + ', ' + speciesLabel(f.plant),
      on: { click: open, keydown: e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); open(); } } } },
      h('div', { class: 'sprite-box' }, spriteImg(f, I), f.streak > 0 && h('span', { class: 'streak px-s', 'aria-label': 'Streak ' + f.streak }, icon('drop', 2), String(f.streak))),
      h('div', { class: 'name-row' }, h('span', { class: 'fname' }, f.name), pill(I)),
      h('button', { type: 'button', class: 'btn sm', on: { click: e => { e.stopPropagation(); openWater(f.id); } } }, icon('heart', 2), I.st === 'gerissen' ? 'Neu starten' : 'Gießen'));
  }
  function group(title, list, cls, ic) {
    return h('section', { class: 'group ' + (cls || '') },
      h('h2', { class: 'group-title' }, ic && icon(ic, 2), title,),
      h('div', { class: 'grid' }, list.map(card)));
  }

  function viewGarden() {
    const act = L.active(), wrap = h('div', { class: 'wrap' });
    if (S().demo) wrap.append(h('div', { class: 'banner' }, h('p', null, 'Das sind Beispieldaten zum Ausprobieren.'),
      h('button', { type: 'button', class: 'btn sm', on: { click: openSettings } }, 'Entfernen')));
    if (!act.length) {
      wrap.append(h('div', { class: 'empty' }, h('img', { class: 'sprite', src: SP.spriteURL('cactus', 1, 0), alt: '', width: 120, height: 120 }),
        h('h2', null, 'Dein Garten ist leer'), h('p', { class: 'muted' }, 'Jede Freundschaft ist eine Pflanze. Pflanze die erste.'),
        h('button', { type: 'button', class: 'btn primary', on: { click: () => openEdit() } }, icon('plus', 2), 'Freundschaft hinzufügen')));
      return wrap;
    }
    const urgent = act.filter(f => ['dringlich', 'verwelkt'].includes(L.info(f).st)).sort(byUrgency);
    const rest = act.filter(f => !urgent.includes(f));
    if (urgent.length) wrap.append(group('Dringlich', urgent, 'urgent', 'drop'));
    L.GRADE_ORDER.forEach(g => {
      const list = rest.filter(f => f.grade === g).sort(byUrgency);
      if (list.length) wrap.append(group(L.gradeName(g), list));
    });
    return wrap;
  }

  function viewArchive() {
    const list = S().friends.filter(f => f.archived), wrap = h('div', { class: 'wrap' });
    wrap.append(h('p', { class: 'muted' }, 'Archivierte Freundschaften sind pausiert. Beim Reaktivieren läuft der Rhythmus dort weiter, wo er stand.'));
    if (!list.length) { wrap.append(h('p', null, 'Das Archiv ist leer.')); return wrap; }
    list.forEach(f => {
      const I = L.info(f);
      wrap.append(h('div', { class: 'arch px' }, h('img', { class: 'sprite', src: SP.spriteURL(f.plant, I.stage, 0, f.pot), alt: '', width: 64, height: 64 }),
        h('div', { class: 'who' }, h('b', null, f.name), h('span', { class: 'muted' }, 'Pausiert seit ' + fmtDate(f.archivedAt || Date.now()) + ' · Streak ' + f.streak)),
        h('div', { class: 'btns' },
          h('button', { type: 'button', class: 'btn sm primary', on: { click: () => { L.reactivate(f); toast(f.name + ' ist zurück im Garten.'); render(); } } }, 'Reaktivieren'),
          confirmBtn('Löschen', 'Sicher?', () => { L.remove(f); toast(f.name + ' wurde gelöscht.'); render(); }))));
    });
    return wrap;
  }

  function viewBadges() {
    const lv = L.levelInfo(), st = S(), wrap = h('div', { class: 'wrap' });
    const hearts = h('div', { class: 'hearts', role: 'img', 'aria-label': 'Wiederbelebungen: ' + L.jokersLeft() + ' von ' + L.JOKERS + ' frei' });
    for (let i = 0; i < L.JOKERS; i++) hearts.append(h('span', { class: 'heart' + (i < L.jokersLeft() ? ' on' : '') }, icon('heart', 3)));
    wrap.append(h('section', { class: 'lvl px' }, h('span', { class: 'lbl' }, 'Level ' + lv.level), h('h3', null, lv.name),
      h('div', { class: 'meter px-s', role: 'progressbar', 'aria-valuemin': '0', 'aria-valuemax': '10', 'aria-valuenow': String(10 - lv.toNext), 'aria-label': 'Fortschritt zum nächsten Level' }, h('i', { style: 'width:' + Math.round(lv.into * 100) + '%' })),
      h('p', { class: 'muted' }, 'Noch ' + lv.toNext + ' Punkte bis Level ' + (lv.level + 1) + '. Jeder Eintrag zählt 1, jedes Abzeichen 5.')));
    wrap.append(h('section', { class: 'group' }, h('h2', { class: 'group-title' }, 'Wiederbelebungen'), hearts,
      h('p', { class: 'muted' }, 'Pro Monat gibt es ' + L.JOKERS + '. Sie retten einen Streak, kurz nachdem die Pflanze verwelkt ist.')));
    wrap.append(h('section', { class: 'group' }, h('h2', { class: 'group-title' }, 'Abzeichen', h('span', { class: 'count' }, Object.keys(st.badges).length + '/' + L.BADGES.length)),
      h('div', { class: 'badges' }, L.BADGES.map(b => {
        const got = !!st.badges[b.id];
        return h('div', { class: 'badge px' + (got ? '' : ' locked') }, h('img', { class: 'bicon', src: SP.badgeURL(b.id), alt: '', width: 80, height: 80 }), h('h3', null, b.name), h('p', null, b.desc), h('p', null, got ? 'Erreicht' : 'Noch offen'));
      }))));
    return wrap;
  }

  /* ---------- Rahmen ---------- */
  const TABS = [['garten', 'Garten', 'home'], ['archiv', 'Archiv', 'box'], ['abzeichen', 'Abzeichen', 'star']];
  function buildChrome() {
    document.getElementById('menu').append(icon('menu', 3));
    document.getElementById('add').append(icon('plus', 3));
    document.getElementById('menu').addEventListener('click', openSettings);
    document.getElementById('add').addEventListener('click', () => openEdit());
    document.getElementById('tabs').replaceChildren(...TABS.map(t => h('button', { type: 'button', class: 'tab', 'data-tab': t[0], on: { click: () => { ui.tab = t[0]; render(); document.getElementById('main').scrollTop = 0; } } }, h('span', { class: 'ic' }, icon(t[2], 3)), t[1])));
  }
  function render() {
    const main = document.getElementById('main'), top = main.scrollTop;
    document.querySelectorAll('.tab').forEach(b => { if (b.dataset.tab === ui.tab) b.setAttribute('aria-current', 'page'); else b.removeAttribute('aria-current'); });
    main.replaceChildren(ui.tab === 'archiv' ? viewArchive() : ui.tab === 'abzeichen' ? viewBadges() : viewGarden());
    main.scrollTop = top;
  }

  function boot() {
    L.setState(L.load() || L.demoState());
    L.normalize(); L.checkBadges(); L.save();
    buildChrome(); render(); weeklyCheck();
    document.addEventListener('visibilitychange', () => { if (!document.hidden) { L.normalize(); L.save(); render(); } });
    document.addEventListener('keydown', e => { if (e.key === 'Escape') closeSheet(); });
  }
  boot();
})();

</script>
<script>
if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')) {
  window.addEventListener('load', function () { navigator.serviceWorker.register('sw.js').catch(function () {}); });
}
</script>
</body>
</html>
